<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>度量看板 · 信贷预审辅助演示</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      const app = document.getElementById("app");
      app.innerHTML = DemoApp.renderShell("metrics");
      const root = document.getElementById("page-root");
      const m = DEMO_DATA.metrics;

      root.innerHTML = `
        <div class="page-header">
          <div>
            <h2>轻量运营度量</h2>
            <p class="subtitle">近 7 日模拟指标 · 用于演示「人机协同是否跑通、是否可量化」</p>
          </div>
          <div class="btn-group">
            <a class="btn btn-outline" href="review.html">← 人工复核</a>
            <a class="btn btn-primary" href="../index.html">回到案件列表</a>
          </div>
        </div>

        <div class="grid-3" style="margin-bottom:16px">
          ${m.kpis
            .map(
              (k) => `
            <div class="card metric-card">
              <div class="metric-val">${k.value}<span class="unit">${k.unit}</span></div>
              <div class="metric-label">${k.label}</div>
              <div class="metric-delta ${k.deltaType}">${k.delta}</div>
            </div>`
            )
            .join("")}
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-title">预审漏斗（近7日 · 模拟）</div>
            <div class="bar-chart">
              ${m.funnel
                .map(
                  (f) => `
                <div class="bar-row">
                  <span>${f.label}</span>
                  <div class="bar-track"><div class="bar-fill" style="width:${f.pct}%"></div></div>
                  <span class="bar-val">${f.val}</span>
                </div>`
                )
                .join("")}
            </div>
          </div>

          <div class="card">
            <div class="card-title">人机一致率（模拟）</div>
            <div class="bar-chart">
              ${m.disagreement
                .map(
                  (d) => `
                <div class="bar-row">
                  <span>${d.label}</span>
                  <div class="bar-track"><div class="bar-fill" style="width:${d.pct}%;background:${
                    d.pct > 50 ? "var(--accent)" : "var(--warning)"
                  }"></div></div>
                  <span class="bar-val">${d.pct}%</span>
                </div>
                <p class="hint" style="margin:-4px 0 8px 110px">${d.note}</p>`
                )
                .join("")}
            </div>
            <div class="callout callout-ai" style="margin-top:16px;margin-bottom:0">
              <strong>演示收尾：</strong>指标证明「输入→AI→人审→可度量」闭环。正式试点需对接真实案件与模型治理——欢迎预约<strong>远程诊断</strong>评估贵行现状与差距。
            </div>
          </div>
        </div>

        <div class="card" style="margin-top:16px;text-align:center;padding:28px">
          <h3 style="color:var(--primary);margin-bottom:8px;font-size:16px">下一步：远程诊断</h3>
          <p class="subtitle" style="max-width:520px;margin:0 auto 16px">
            用 60–90 分钟梳理贵行零售信贷预审的数据、规则、人审与审计现状，输出可落地的 AI 原生试点范围（脱敏演示 ≠ 生产就绪）。
          </p>
          <div class="btn-group" style="justify-content:center">
            <a class="btn btn-accent btn-lg" href="../index.html">再走一遍主路径</a>
            <button type="button" class="btn btn-primary btn-lg" id="btn-cta">了解远程诊断（演示）</button>
          </div>
          <div id="cta-booking" hidden style="max-width:560px;margin:20px auto 0;text-align:left">
            <div class="callout callout-info" style="margin-bottom:0">
              <strong>预约信息（演示占位 · 无真实后端）</strong>
              <p style="margin:10px 0 8px;font-size:13px;line-height:1.6">联系原生未来首席 / 预约 60–90 分钟远程诊断。以下为演示占位邮箱，非生产联系方式。</p>
              <pre id="cta-copy-text" style="white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,0.65);border:1px solid #93c5fd;border-radius:6px;padding:12px;font-size:12px;line-height:1.55;font-family:var(--mono);color:var(--text);margin:0 0 12px;user-select:all">【原生未来 · 远程诊断预约 · 演示占位】
主题：零售信贷预审 AI 原生试点 · 远程诊断（60–90 分钟）
联系：hello@nativefuture.example（演示占位邮箱，非真实收件）
说明：请将贵行现状摘要（脱敏）与期望窗口回复至该邮箱；本页面无表单后端，信息仅供复制。
来源：信贷预审辅助演示 · GitHub Pages</pre>
              <div class="btn-group">
                <button type="button" class="btn btn-primary" id="btn-copy-cta">复制预约信息</button>
              </div>
              <p class="hint" id="cta-copy-hint" style="margin-top:8px;margin-bottom:0"></p>
            </div>
          </div>
        </div>

        <div class="page-actions">
          <a class="btn btn-ghost" href="review.html">← 人工复核</a>
          <span class="hint">演示结束 · 模拟数据 · 不接生产</span>
        </div>
      `;

      const bookingPanel = document.getElementById("cta-booking");
      const copyTextEl = document.getElementById("cta-copy-text");
      const copyHint = document.getElementById("cta-copy-hint");

      document.getElementById("btn-cta").addEventListener("click", () => {
        bookingPanel.hidden = false;
        bookingPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
        DemoApp.showToast("已展开预约说明（演示占位 · 可复制）");
      });

      function selectCopyText() {
        const range = document.createRange();
        range.selectNodeContents(copyTextEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      document.getElementById("btn-copy-cta").addEventListener("click", () => {
        const text = copyTextEl.textContent.trim();
        const done = function (ok) {
          if (ok) {
            copyHint.textContent = "✓ 已复制到剪贴板（演示占位信息）。";
            DemoApp.showToast("预约信息已复制");
          } else {
            selectCopyText();
            copyHint.textContent = "自动复制失败：已选中文本，请按 Ctrl/Cmd+C 手动复制。";
            DemoApp.showToast("请手动复制已选中文本");
          }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { done(false); });
        } else {
          try {
            selectCopyText();
            const ok = document.execCommand("copy");
            done(!!ok);
          } catch (e) {
            done(false);
          }
        }
      });
    })();
  </script>
</body>
</html>
