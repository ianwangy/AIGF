<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人工复核 · 信贷预审辅助演示</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      const app = document.getElementById("app");
      app.innerHTML = DemoApp.renderShell("review");
      const root = document.getElementById("page-root");
      const c = DemoApp.getSelectedCase();
      const details = DemoApp.getCaseDetails(c.id);
      const ai = details.aiSuggestion;
      const timeline = details.auditTimeline.slice();
      const isContrast = DemoApp.isHighRiskContrast(c);
      const isRejectVerdict = /拒绝|强制人审/.test(ai.verdict);
      const preAdoptRaw = sessionStorage.getItem("demo_pre_adopt") === "1";
      const preAdoptCase = sessionStorage.getItem("demo_pre_adopt_case");
      const preAdopt = preAdoptRaw && (!preAdoptCase || preAdoptCase === c.id);

      /* 默认决策：对照案（AI 拒绝）默认选拒绝；主路径预采纳则选通过 */
      let defaultDecision = null;
      if (isContrast || isRejectVerdict) {
        defaultDecision = preAdopt || isContrast ? "reject" : null;
      } else if (preAdopt) {
        defaultDecision = "pass";
      }

      const suggestedAmt = ai.suggestedAmount != null ? ai.suggestedAmount : 0;
      const applyAmt = c.amount;
      const amtOptions = [];
      amtOptions.push({ value: String(applyAmt), label: applyAmt.toLocaleString("zh-CN") + "（原申请）" });
      if (suggestedAmt > 0 && suggestedAmt !== applyAmt) {
        amtOptions.push({
          value: String(suggestedAmt),
          label: suggestedAmt.toLocaleString("zh-CN") + "（AI 建议）"
        });
      }
      const mid = Math.round(applyAmt * 0.53 / 10000) * 10000;
      if (mid > 0 && mid !== applyAmt && mid !== suggestedAmt) {
        amtOptions.push({ value: String(mid), label: mid.toLocaleString("zh-CN") });
      }
      amtOptions.push({ value: "0", label: "—（拒绝/退回不适用）" });

      const defaultAmt =
        defaultDecision === "reject" || defaultDecision === "return"
          ? "0"
          : suggestedAmt > 0
            ? String(suggestedAmt)
            : String(applyAmt);

      function preAdoptCallout() {
        if (isContrast) {
          return `<div class="callout callout-danger"><strong>本场景用于演示人审改判：</strong>AI 建议「${ai.verdict}」（综合分 ${ai.score}）。默认选中「拒绝」，您可改选「有条件通过」或「退回补件」并填写例外理由，提交后写入审计时间线。</div>`;
        }
        if (preAdopt) {
          if (isRejectVerdict) {
            return `<div class="callout callout-ai">已从 AI 建议页预采纳：${ai.verdict}。可直接提交，或改判为有条件通过 / 退回补件。</div>`;
          }
          return `<div class="callout callout-ai">已从 AI 建议页预采纳：${ai.verdict}${
            suggestedAmt > 0 ? " · 建议额度 " + (ai.suggestedAmountLabel || "") : ""
          }。可直接提交或改判。</div>`;
        }
        return `<div class="callout callout-info">请选择决策并填写理由。提交后将追加审计事件（演示写入本页时间线）。${
          isRejectVerdict ? " 当前 AI 建议为「" + ai.verdict + "」，人审可改判。" : ""
        }</div>`;
      }

      const defaultReason = (function () {
        if (!preAdopt && !isContrast) return "";
        if (isContrast || isRejectVerdict) {
          return "采纳 AI「" + ai.verdict + "」：材料严重缺失且高风险规则命中，不得自动通过。（演示可改判并改写本理由）";
        }
        return (
          "采纳 AI「" +
          ai.verdict +
          "」建议：" +
          (suggestedAmt > 0 ? "核准额度 " + (ai.suggestedAmountLabel || "") + "；" : "") +
          "关注材料与规则预警项。"
        );
      })();

      function optClass(v) {
        if (defaultDecision !== v) return "";
        if (v === "pass") return "selected-pass";
        if (v === "reject") return "selected-reject";
        return "selected-return";
      }

      root.innerHTML = `
        <div class="page-header">
          <div>
            <h2>人工复核 &amp; 审计时间线</h2>
            <p class="subtitle">案件 ${c.id} · ${c.applicant} · 终裁权在人 · 全量可追溯</p>
          </div>
          <div class="btn-group">
            <a class="btn btn-outline" href="ai-suggest.html">← AI 建议</a>
            <a class="btn btn-primary" href="metrics.html">查看度量看板 →</a>
          </div>
        </div>

        <div class="grid-side-main">
          <div class="card">
            <div class="card-title">审计时间线</div>
            <p class="hint" style="margin-top:-2px;margin-bottom:10px">时间线为演示时钟，非生产审计时区。</p>
            <div class="timeline" id="timeline">
              ${timeline
                .map(
                  (t) => `
                <div class="tl-item">
                  <div class="tl-dot ${t.type}"></div>
                  <div class="tl-time">${t.time}</div>
                  <div class="tl-content"><strong>${t.actor}</strong> — ${t.text}</div>
                </div>`
                )
                .join("")}
            </div>
          </div>

          <div class="card">
            <div class="card-title">复核决策${isContrast ? ' <span class="badge badge-high">改判演示</span>' : ""}</div>
            ${preAdoptCallout()}

            <div class="decision-options" id="decisions">
              <div class="decision-opt ${optClass("pass")}" data-v="pass">
                <div class="opt-title">${isContrast ? "改判 · 有条件通过" : "有条件通过"}</div>
                <div class="opt-desc">${isContrast ? "例外放行 · 须填理由并补件" : "下调额度 / 补件后放行"}</div>
              </div>
              <div class="decision-opt ${optClass("return")}" data-v="return">
                <div class="opt-title">${isContrast ? "改判 · 退回补件" : "退回补件"}</div>
                <div class="opt-desc">${isContrast ? "要求补齐身份证/流水/授权等" : "要求补充工作证明等"}</div>
              </div>
              <div class="decision-opt ${optClass("reject")}" data-v="reject">
                <div class="opt-title">拒绝</div>
                <div class="opt-desc">${isContrast ? "维持 AI 建议 · 高风险不可过" : "负债匹配度不足"}</div>
              </div>
            </div>

            <div class="review-form">
              <label for="amount">核准额度（元）</label>
              <select id="amount">
                ${amtOptions
                  .map(
                    (o) =>
                      `<option value="${o.value}" ${o.value === defaultAmt ? "selected" : ""}>${o.label}</option>`
                  )
                  .join("")}
              </select>

              <label for="reason">决策理由（必填 · 进入审计）</label>
              <textarea id="reason" rows="4" placeholder="${
                isContrast
                  ? "例：改判有条件通过——客户为老客，例外下调至 8 万并要求 3 日内补齐流水与授权。"
                  : "例：采纳 AI 下调额度建议；流水波动可接受，要求补传工作证明后放款前核验。"
              }">${defaultReason}</textarea>

              <div class="btn-group">
                <button type="button" class="btn btn-primary" id="btn-submit">提交决策</button>
                <button type="button" class="btn btn-outline" id="btn-reset">重置</button>
              </div>
              <p class="hint" style="margin-top:10px" id="submit-hint"></p>
            </div>
          </div>
        </div>

        <div class="page-actions">
          <a class="btn btn-ghost" href="ai-suggest.html">← AI 建议</a>
          <a class="btn btn-accent" href="metrics.html">下一步：轻量度量看板 →</a>
        </div>
      `;

      let decision = defaultDecision;

      document.querySelectorAll(".decision-opt").forEach((el) => {
        el.addEventListener("click", () => {
          document.querySelectorAll(".decision-opt").forEach((o) => {
            o.classList.remove("selected-pass", "selected-reject", "selected-return");
          });
          decision = el.dataset.v;
          if (decision === "pass") el.classList.add("selected-pass");
          else if (decision === "reject") el.classList.add("selected-reject");
          else el.classList.add("selected-return");

          const amtEl = document.getElementById("amount");
          if (decision === "reject" || decision === "return") {
            amtEl.value = "0";
          } else if (suggestedAmt > 0) {
            amtEl.value = String(suggestedAmt);
          }
        });
      });

      document.getElementById("btn-reset").addEventListener("click", () => {
        decision = null;
        document.querySelectorAll(".decision-opt").forEach((o) => {
          o.classList.remove("selected-pass", "selected-reject", "selected-return");
        });
        document.getElementById("reason").value = "";
        document.getElementById("submit-hint").textContent = "";
        sessionStorage.removeItem("demo_pre_adopt");
        sessionStorage.removeItem("demo_pre_adopt_case");
      });

      document.getElementById("btn-submit").addEventListener("click", () => {
        const reason = document.getElementById("reason").value.trim();
        if (!decision) {
          DemoApp.showToast("请先选择决策：通过 / 退回 / 拒绝");
          return;
        }
        if (!reason) {
          DemoApp.showToast("请填写决策理由（审计必填）");
          return;
        }
        const labels = { pass: "有条件通过", return: "退回补件", reject: "拒绝" };
        const overrideNote =
          isRejectVerdict && decision !== "reject"
            ? "【人审改判 · 偏离 AI「" + ai.verdict + "」】"
            : isRejectVerdict && decision === "reject"
              ? "【与 AI 建议一致】"
              : !isRejectVerdict && decision === "reject"
                ? "【人审改判 · 偏离 AI「" + ai.verdict + "」】"
                : "";
        const amt = document.getElementById("amount").value;
        /* 演示时钟：承接本案件时间线末条，不使用本地墙钟 */
        const timeStr = DemoApp.nextDemoClockTime({
          caseId: c.id,
          timeline: Array.from(document.querySelectorAll("#timeline .tl-time")).map(function (el) {
            return { time: el.textContent.trim() };
          }),
          incrementSec: 28
        });

        const tl = document.getElementById("timeline");
        const item = document.createElement("div");
        item.className = "tl-item";
        item.innerHTML = `
          <div class="tl-dot human"></div>
          <div class="tl-time">${timeStr}</div>
          <div class="tl-content"><strong>预审岗 · 周*</strong> — 提交决策：${labels[decision]}${
            overrideNote ? " " + overrideNote : ""
          }；额度 ${
          amt === "0" ? "不适用" : "¥" + Number(amt).toLocaleString("zh-CN")
        }。理由：${reason}</div>
        `;
        tl.appendChild(item);
        document.getElementById("submit-hint").textContent =
          "✓ 决策已写入审计时间线（演示本地）。可继续查看度量看板。";
        sessionStorage.setItem("demo_decision", decision);
        DemoApp.showToast(
          overrideNote && decision !== "reject"
            ? "人审改判已提交 · 审计事件已追加"
            : "复核决策已提交 · 审计事件已追加"
        );
      });
    })();
  </script>
</body>
</html>
